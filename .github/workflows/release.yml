
name: Build and Release

run-name: Build ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v1.4.5"

  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build and release"
        required: true
        type: string
        default: "v1.4.5"

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "30.0.16248370"
  ANDROID_API_LEVEL: "24"

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          EXPECTED_TAG="v${VERSION}"

          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Expected tag: $EXPECTED_TAG"
            echo "Received tag: $RELEASE_TAG"
            exit 1
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building version $RELEASE_TAG"

  build-cli:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: prepare

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary_path: target/release/unluac-cli
            extension: ""

          - os: windows-2025
            platform: windows-x86_64
            binary_path: target/release/unluac-cli.exe
            extension: ".exe"

          - os: macos-15-intel
            platform: macos-x86_64
            binary_path: target/release/unluac-cli
            extension: ""

          - os: macos-15
            platform: macos-aarch64
            binary_path: target/release/unluac-cli
            extension: ""

          - os: ubuntu-24.04
            platform: termux-aarch64
            binary_path: target/aarch64-linux-android/release/unluac-cli
            extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply temporary custom defaults
        run: python .github/scripts/apply_custom_defaults.py

      - name: Setup Android SDK and NDK
        if: matrix.platform == 'termux-aarch64'
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;30.0.16248370"

      - name: Configure Android linker
        if: matrix.platform == 'termux-aarch64'
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK not found" >&2
            exit 1
          fi

          NDK="$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LINKER="$TOOLCHAIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang"

          if [[ ! -x "$LINKER" ]]; then
            echo "Android linker not found: $LINKER" >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LINKER" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$LINKER" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Setup native Rust
        if: matrix.platform != 'termux-aarch64'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Termux Rust target
        if: matrix.platform == 'termux-aarch64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build native binary
        if: matrix.platform != 'termux-aarch64'
        run: cargo build -p unluac-cli --release --locked

      - name: Build Termux ARM64 binary
        if: matrix.platform == 'termux-aarch64'
        run: cargo build -p unluac-cli --release --locked --target aarch64-linux-android

      - name: Prepare binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          cp "${{ matrix.binary_path }}" \
            "release-assets/unluac-${RELEASE_TAG}-${{ matrix.platform }}${{ matrix.extension }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unluac-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build-cli

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: unluac-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Verify existing tag
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

            TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"

            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "The existing tag points to a different commit." >&2
              echo "Tag commit: $TAG_COMMIT" >&2
              echo "Build commit: $GITHUB_SHA" >&2
              exit 1
            fi
          else
            echo "Tag does not exist yet. It will be created with the release."
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="${RUNNER_TEMP}/release-assets"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSETS"/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false \
              --title "unluac $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "$ASSETS"/* \
              --title "unluac $RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
